name: Pages

# The public site: results/SUMMARY.md as a page, and the diagnostics and model-scorecard notebooks exported to
# WebAssembly (each frozen with the committed data folder notebooks/data/lr_program).
# Built on every PR (so a broken export fails review); deployed from main and feat/lr-program-final.
on:
  push:
    branches: [main, feat/lr-program-final]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "marimo>=0.25" markdown uv
      - name: Results page
        run: python tools/build_pages.py -o site
      - name: Notebooks (WebAssembly, frozen with notebooks/data/lr_program)
        run: python tools/build_notebook_site.py -o site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # feat/lr-program-final also deploys (needs the matching branch policy on the github-pages environment)
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/lr-program-final')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
